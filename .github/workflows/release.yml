name: Publish the hvrg provider

on:
  workflow_dispatch:
    inputs:
      tag:
        description: the nimling/hvergel release tag, v<version>
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    uses: nimling/nimbody/.github/workflows/terraform-provider.yml@main
    with:
      cli: hvrg
      repository: nimling/hvergel
      tag: ${{ inputs.tag }}
    secrets:
      repo_token: ${{ secrets.DOCKER_PACKAGE_READ }}
